lag_llama:
  panel: core
  head_type: parametric_student_t   # CONFIRMED param head (D2): worker exposes the
    # official forward's (df, loc, scale) via hook; analytic quantile path live in
    # the adapter and validated against S=4000 sampling (1% tail within MC noise).
    # Sampling path retained for D3 S-calibration (exact truth available).
  native_tail_behavior: analytic-parametric   # closed-form Student-t quantiles at any level.
    # Stage-4 signer classification: THIRD failure mode — "distinguishable but
    # systematically too narrow" (native 5% VaR violates ~9.8% on SPX; 0-5% coverage
    # pass across E-rules; scale verified sane). Contrast: bolt = "clamped /
    # non-distinguishable". The two pathologies of forecast form.
  hf_repo: time-series-foundation-models/Lag-Llama
  hf_revision: 72dcfc29da106acfe38250a60f4ae29d1e56a3d9   # main @ 2024-05-14, lag-llama.ckpt
  code:
    install: envs/lag-llama-requirements.txt
    git_commit: df7531a83a19b3c6a0222d703ca9bf59ef7a6ab9   # github.com/time-series-foundation-models/lag-llama
  runtime: isolated venv .venv-lag-llama; adapter calls via subprocess (dep conflict
    with uni2ts — see CHANGELOG 2026-07-04). Persistent server (harness/lagllama_server.py,
    LagLlamaServerAdapter) added 2026-07-06 for the full grid — one ckpt load, streaming
    protocol, bit-identical to subprocess (test_lagllama_server.py), ~39x faster/call
    (2.49s -> 0.06s) => full-grid ~1.5 CPU-h. Gate condition 1 satisfied.
  pretraining_cutoff: "undisclosed; upper bound 2023-10 (arXiv:2310.08278 v1 —
    model trained before paper submission; ckpt file dated 2024-05-14).
    Corpus: Monash + others per paper; no calendar cutoff disclosed."   # registered D2 2026-07-04
  cutoff_sources:
    - https://huggingface.co/time-series-foundation-models/Lag-Llama/raw/72dcfc29da106acfe38250a60f4ae29d1e56a3d9/README.md
    - https://arxiv.org/abs/2310.08278

# --- mechanism panel (12-asset subset; within-family head contrasts) ---
# Implemented + E0-frozen in the mechanism sub-panel round (2026-07-16, signer-
# authorized). E0 probe: SAME spec as the CORE heads (seed 20260704, 512-pt
# t(5)*1.2 ctx, levels {1%,2.5%,5%}); values are the INTERFACE CONTRACT only, no
# calibration claim (calibration = the mechanism grid, results/mechanism/).
chronos_base:
  panel: mechanism
  head_type: token_quantized_sampling
  hf_repo: amazon/chronos-t5-base
  hf_revision: ad294eaacead15db499b740ea4122266dd2a81a2   # id-asserted via HF API 2026-07-04/16
  adapter: harness/chronos_base_adapter.py:ChronosBaseAdapter   # smoke + faithfulness-tested 2026-07-16
  native_tail_behavior: distinguishable-token-quantized   # distinct monotone 1/2.5/5% on probe,
    # but the one-step predictive categorical has <=50 support points (top_k=50) and
    # only ~3 distinct token-center values below q05 — the deep tail is coarsely
    # quantized. Extraction = S=1000 empirical quantiles (D3 MC convention); the
    # fast sampler reproduces native predict() to <0.01 (test_mechanism_adapters).
  e0_probe: {q01: -0.4024, q025: -0.3860, q05: -0.3696, support_points: 50, tail_centers_below_q05: 3}
  pretraining_cutoff: "undisclosed; upper bound 2025-11-21 (pinned-revision
    lastModified; ckpt created 2024-02-21). Corpus per the Chronos paper
    (arXiv:2403.07815); no calendar cutoff disclosed."   # registered 2026-07-16
  cutoff_sources:
    - https://huggingface.co/amazon/chronos-t5-base/raw/ad294eaacead15db499b740ea4122266dd2a81a2/README.md
    - https://arxiv.org/abs/2403.07815

moirai_1_1:
