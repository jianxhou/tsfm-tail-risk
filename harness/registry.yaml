# Model registry: every HF revision pinned (full 40-char sha, id-asserted from the HF
# API); pretraining data cutoff must be documented WITH SOURCE before the model
# produces any scientific number (hard rule 2). Where only a release date is public,
# it is recorded as an upper bound and the rigorous cutoff registration happens in
# pilot D2 (proposal §9) — marked TODO-D2.
#
# native_tail_behavior (E0 interface facts, frozen 2026-07-04 from the smoke probe,
# 512-pt t(5) context, levels {1%, 2.5%, 5%}):
#   INTERPRETATION DISCIPLINE — these entries record the INTERFACE CONTRACT only
#   (what the official implementation returns when asked for deep-tail levels).
#   A single probe supports NO calibration conclusion; Chronos-2/Moirai-2 deep-tail
#   values fatter than the t(5) truth are expected finite-context behavior, not
#   evidence of miscalibration. Calibration judgment belongs to the pilot (D2-D5).

chronos_bolt:
  panel: core
  head_type: bounded_quantile_grid   # trained deciles 0.1–0.9; deep-tail request behavior = D2 fact
  hf_repo: amazon/chronos-bolt-base
  hf_revision: 5d9f166d69f47aef3401367a7b842e78fe97b121   # lastModified 2025-11-21
  adapter: harness/chronos_adapters.py:ChronosBoltAdapter  # smoke-tested 2026-07-04
  native_tail_behavior: clamp-to-decile-edge   # q0.01=q0.025=q0.05 on probe
  pretraining_cutoff: "undisclosed; upper bound 2025-11-21 (pinned-revision lastModified;
    ckpt first released 2024-11). Card states ~100B observations, corpus per the
    Chronos paper; no calendar cutoff disclosed."   # registered D2 2026-07-04
  cutoff_sources:
    - https://huggingface.co/amazon/chronos-bolt-base/raw/5d9f166d69f47aef3401367a7b842e78fe97b121/README.md
    - https://arxiv.org/abs/2403.07815

chronos_2:
