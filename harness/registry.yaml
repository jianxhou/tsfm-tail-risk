  hf_repo: amazon/chronos-2
  hf_revision: 29ec3766d36d6f73f0696f85560a422f50e8498c   # lastModified 2026-06-05
  adapter: harness/chronos_adapters.py:Chronos2Adapter     # smoke-tested 2026-07-04
  native_tail_behavior: distinguishable   # distinct monotone 1%/2.5%/5% on probe
  pretraining_cutoff: "undisclosed on card; upper bound 2025-10 (tech report
